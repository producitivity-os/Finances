name: Finances

options:
  bundleIdPrefix: com.productivitysuite
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  ProductivityUI:
    path: ../../packages/ProductivityUI
  ProductivityRoutineKit:
    path: ../../packages/ProductivityRoutineKit
  ProductivityCloudKit:
    path: ../../packages/ProductivityCloudKit

targets:
  Finances:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ProductivityUI
      - package: ProductivityRoutineKit
      - package: ProductivityCloudKit
      - sdk: Charts.framework
      - sdk: CloudKit.framework
      - sdk: PDFKit.framework
      - sdk: Vision.framework
    entitlements:
      path: Sources/macOS/Platform/Finances.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Sources/macOS/Platform/Info.plist
      properties:
        CFBundleDisplayName: Finances
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.finances
        PRODUCT_NAME: Finances
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FinancesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SharedTests
      - path: Tests/macOSTests
    dependencies:
      - target: Finances
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.finances.tests
        GENERATE_INFOPLIST_FILE: YES

  FinancesIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ProductivityUI
      - package: ProductivityRoutineKit
      - package: ProductivityCloudKit
      - sdk: Charts.framework
      - sdk: CloudKit.framework
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
    entitlements:
      path: Sources/iOS/Platform/FinancesIOS.entitlements
    info:
      path: Sources/iOS/Platform/Info.plist
      properties:
        CFBundleDisplayName: Finances
        NSCameraUsageDescription: Finances uses the camera to scan receipts and bank statements.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.finances.ios
        PRODUCT_NAME: Finances
        PRODUCT_MODULE_NAME: FinancesIOS
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  FinancesIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SharedTests
      - path: Tests/iOSTests
    dependencies:
      - target: FinancesIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.productivitysuite.finances.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Finances.app/Finances
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Finances:
    shared: true
    build:
      targets:
        Finances: all
        FinancesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FinancesTests]
    archive:
      config: Release
  FinancesIOS:
    shared: true
    build:
      targets:
        FinancesIOS: all
        FinancesIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FinancesIOSTests]
    archive:
      config: Release
